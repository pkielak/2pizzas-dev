# pins the compose project name → the network is always `gitea_gitea`
# (00-tea's chat containers join it via CHAT_NETWORK)
name: gitea

networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:1.27.2
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB}
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      # webhooks may only call these hosts (Gitea security default blocks LAN IPs)
      - GITEA__security__ALLOWED_HOST_LIST=00-tea
      # no open self-registration — accounts are created by seed.sh only
      - GITEA__service__DISABLE_REGISTRATION=TRUE
      # git-over-SSH unused (all remotes are http + token) — no sshd on :222
      - GITEA__server__DISABLE_SSH=TRUE
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gitea
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # bound to the tailnet + LAN IPs (set in .env) + loopback for host-side
      # tooling (seed.sh, setup.sh) — never 0.0.0.0
      - "${HOST_TAILNET:?set HOST_TAILNET in .env}:3000:3000"
      - "${HOST_LAN:?set HOST_LAN in .env}:3000:3000"
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:14
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data

  # ── Static pages server ──────────────────────────────────────
  # Gitea 1.27 has NO native Pages — this serves the repo's `gh-pages`
  # branch (pushed by a CI workflow in the target repo) on :3002
  pages:
    build: ./pages
    container_name: gitea-pages
    restart: always
    environment:
      - PAGES_REPO=${PAGES_REPO:-http://gitea:3000/admin/my-repo.git}
      - PAGES_BRANCH=gh-pages
      - PAGES_TOKEN=${REVIEW_TOKEN}   # read-only review token — pages only pulls
    networks:
      - gitea
    ports:
      - "${HOST_TAILNET:?set HOST_TAILNET in .env}:3002:8080"
      - "${HOST_LAN:?set HOST_LAN in .env}:3002:8080"
      - "${HOST_TAILNET:?set HOST_TAILNET in .env}:3443:8443"
      - "${HOST_LAN:?set HOST_LAN in .env}:3443:8443"
    volumes:
      - ./pages/certs:/etc/nginx/certs:ro
    depends_on:
      - server

  # ── browser-llm-bench pages (same server, second repo) ──
  # Serves the browser-llm-bench repo's `gh-pages` branch (pushed by the
  # repo's pages CI workflow) on :3004. The stock `pages` service above is
  # single-repo, so this is a second instance of the same image.
  browser-llm-bench-pages:
    build: ./pages
    container_name: browser-llm-bench-pages
    restart: always
    environment:
      - PAGES_REPO=${PAGES_BENCH_REPO}
      - PAGES_BRANCH=gh-pages
      - PAGES_TOKEN=${REVIEW_TOKEN}   # read-only review token — pages only pulls
    networks:
      - gitea
    ports:
      - "${HOST_TAILNET:?set HOST_TAILNET in .env}:3004:8080"
      - "${HOST_LAN:?set HOST_LAN in .env}:3004:8080"
      - "${HOST_TAILNET:?set HOST_TAILNET in .env}:3444:8443"   # same tailnet cert as :3443 (port is not in TLS names)
      - "${HOST_LAN:?set HOST_LAN in .env}:3444:8443"
    volumes:
      - ./pages/certs:/etc/nginx/certs:ro
    depends_on:
      - server

  # ── Existing runner (runc) ──────────────────────────────────
  runner:
    image: docker.io/gitea/runner:3
    container_name: gitea-runner
    restart: always
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_INSTANCE_URL=http://gitea:3000/
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=my-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest
    networks:
      - gitea
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner/config.yaml:/config.yaml

  # ── Android build runner (label `android`, custom job image) ──
  # Separate from my-runner: jobs opt in with `runs-on: android` and get the
  # gitea-android image (JDK 21 + Android SDK + pre-warmed ~/.gradle).
  # Image: docker build -t gitea-android:latest runner/android
  android-runner:
    image: docker.io/gitea/runner:3
    container_name: gitea-android-runner
    restart: always
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_INSTANCE_URL=http://gitea:3000/
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_ANDROID_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=android-runner
      - GITEA_RUNNER_LABELS=android:docker://gitea-android:latest
    networks:
      - gitea
    volumes:
      - ./data-android:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner/config.yaml:/config.yaml

  # ── Agent dispatcher (replaces agent-runner + agent workflows) ──
  # Gitea webhooks → sqlite queue → `docker run --runtime=runsc
  # agent-sandbox:<agent>` per task. UI: http://127.0.0.1:3001
  00-tea:
    build: ./00-tea
    container_name: gitea-00-tea
    restart: always
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      # per-agent Gitea identities — each work agent acts as its own user
      # (native @mention autocomplete + per-agent attribution)
      - PI_TOKEN=${PI_TOKEN}
      - OPENCODE_TOKEN=${OPENCODE_TOKEN}
      - INFRA_TOKEN=${INFRA_TOKEN}
      - REVIEW_TOKEN=${REVIEW_TOKEN}       # review user, READ — reviewer clone (can't push)
      - REVIEW_POST_TOKEN=${REVIEW_POST_TOKEN}  # review user, WRITE — 00-tea posts verdicts
      - AGENT_IMAGE_REVIEW=${AGENT_IMAGE_REVIEW:-agent-sandbox:review}
      - REVIEW_MAX_ROUNDS=${REVIEW_MAX_ROUNDS:-3}
      # @infra agent: repairs the stack (runc + host docker socket + the infra
      # repo bind-mounted read-only; see 00-tea/tasks.mjs). Auto-enqueued on
      # infra-class failures; @infra on the infra repo works it manually.
      - AGENT_IMAGE_INFRA=${AGENT_IMAGE_INFRA:-agent-sandbox:infra}
      - INFRA_REPO=${INFRA_REPO}
      - INFRA_HOST_REPO=${INFRA_HOST_REPO:-}
      - INFRA_COOLDOWN_MINUTES=${INFRA_COOLDOWN_MINUTES:-15}
      - GITEA_API=http://gitea:3000/api/v1
      - GITEA_HOST=host.docker.internal:3000
      - AGENTD_REPOS=${AGENTD_REPOS}   # managed repos — single source of truth in .env
      - LLAMA_CPP_URL=${LLAMA_CPP_URL} # llama.cpp router — 00-tea runs pi on a loadable model
      - ADMIN_TOKEN=${ADMIN_TOKEN}     # admin-scope token — /android (actions runs API)
      # /pages sidebar: repo:port:container per pages/ service instance
      - PAGES_SITES=${PAGES_SITES:-}
      # optional gate for the /chat pages+API (the UI is tailnet-reachable)
      - CHAT_TOKEN=${CHAT_TOKEN:-}
      - UI_TOKEN=${UI_TOKEN:-}         # whole-UI gate (falls back to CHAT_TOKEN)
      # /chat agents act as the separate "chat" Gitea user (audit separation
      # from task work); per-repo write access is granted from the /chat UI
      - CHAT_GITEA_TOKEN=${CHAT_GITEA_TOKEN:-}
      - CHAT_LOGIN=chat
      # network the chat containers join (reached by container name, no port publish)
      - CHAT_NETWORK=${CHAT_NETWORK:-gitea_gitea}
      # resource caps for the long-lived chat containers (inference is on the
      # host's llama.cpp — the container only needs node + git + light builds)
      - CHAT_MEMORY=${CHAT_MEMORY:-4g}
      - CHAT_CPUS=${CHAT_CPUS:-2}
      # cap for one-shot agent job containers (1 concurrent) — protects the
      # host cores reserved for llama.cpp (setup.sh CPU plan)
      - AGENT_CPUS=${AGENT_CPUS:-2}
      # UI mirrors the Gitea theme: reads it from the db + gitea binary (see server.mjs)
      - GITEA_DB_USER=${POSTGRES_USER}
      - GITEA_DB_NAME=${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gitea
    volumes:
      - ./data-00-tea:/data
      # inference backend registry (gitignored — carries API keys); 00-tea
      # re-reads it on change, no restart needed. NO :ro — the /backends UI
      # edits it IN PLACE (a rename would swap the bind inode and the
      # container would keep seeing the old file)
      - ./inference.json:/app/inference.json
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HOST_TAILNET:?set HOST_TAILNET in .env}:3001:3001"   # reachable on the tailnet: http://<host>.<tailnet>.ts.net:3001
      - "${HOST_LAN:?set HOST_LAN in .env}:3001:3001"
      - "127.0.0.1:3001:3001"   # loopback for host-side checks (setup.sh healthz)
    depends_on:
      - server
