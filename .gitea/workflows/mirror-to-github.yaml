name: Mirror main to GitHub

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitea/workflows/**'


permissions:
  contents: read

jobs:
  mirror-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned — supply-chain hygiene)
        with:
          fetch-depth: 0

      - name: Push main to GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO || 'your-github/repo' }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::No MIRROR_TOKEN secret set."
            exit 1
          fi

          remote_url="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"

          git remote remove github >/dev/null 2>&1 || true
          git remote add github "${remote_url}"

          # Gitea is the source of truth — the mirror force-pushes so it tracks
          # Gitea's main exactly (GitHub-only commits get clobbered on purpose).
          # Fetch first: --force-with-lease leases against the tracking ref,
          # which does not exist for a freshly-added remote ("stale info").
          git fetch github main --no-tags >/dev/null 2>&1 || true
          git push --force-with-lease github HEAD:main
