# 8443 TLS server block — a valid snippet for the http{} context.
# Not loaded directly: the entrypoint copies it to /etc/nginx/ssl-server.conf
# (which nginx.conf includes) only when a real cert pair is mounted; absent
# certs → the entrypoint writes an empty file, so the site runs HTTP-only.
server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    root /srv/pages;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
