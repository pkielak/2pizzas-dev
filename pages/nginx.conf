worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 8080;
        root /srv/pages;
        index index.html;

        # SPA fallback: unknown paths serve the app shell
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
