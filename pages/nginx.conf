worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 8080;
        root /srv/pages;
        index index.html;

        # SPA fallback: unknown paths serve the app shell
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Optional TLS (8443) — the entrypoint writes /etc/nginx/ssl-server.conf
    # before starting nginx: the baked 8443 block when certs are present, an
    # empty file (no-op include) when running HTTP-only. Keeping this include
    # unconditional means the base config never references a missing file.
    include /etc/nginx/ssl-server.conf;
}
