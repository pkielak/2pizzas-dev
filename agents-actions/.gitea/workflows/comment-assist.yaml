name: Comment Assist

# Conversation comments on both issues and PRs use the issue_comment event.
# Jobs are gated by mention (@pi / @opencode) and by the agent-marker so the
# agents never reply to their own comments. Agents act as the 'bot' user so
# their commits/PRs/comments can be reviewed.
on:
  issue_comment:
    types: [created]

env:
  GITEA_API: ${{ gitea.api_url }}
  GITEA_REPO: ${{ gitea.repository }}
  GITEA_SERVER: ${{ gitea.server_url }}

jobs:
  assist-pi:
    name: Assist (pi)
    if: "contains(gitea.event.comment.body, '@pi') && !contains(gitea.event.comment.body, '<!-- via:agent -->')"
    runs-on: agent-pi
    steps:
      - uses: actions/checkout@v4

      - name: Configure bot identity
        run: |
          git config --global user.name bot
          git config --global user.email bot@localhost
          host="${GITEA_SERVER#http://}"; host="${host%/}"
          git remote set-url origin "http://bot:${AGENT_TOKEN}@${host}/${GITEA_REPO}.git"

      - name: Assist with pi
        env:
          ISSUE_NO: ${{ gitea.event.issue.number }}
          ISSUE_TITLE: ${{ gitea.event.issue.title }}
          ISSUE_BODY: ${{ gitea.event.issue.body }}
          IS_PULL: ${{ gitea.event.is_pull }}
          COMMENT_BODY: ${{ gitea.event.comment.body }}
        run: |
          set -euo pipefail
          REQUEST="$(printf '%s' "$COMMENT_BODY" | sed 's/@pi[[:space:]]*//g')"

          if [ "$IS_PULL" = "true" ]; then
            GUIDE="The comment is on PULL REQUEST #$ISSUE_NO.
            Find its head branch: curl -s -H 'Authorization: token $AGENT_TOKEN' $GITEA_API/repos/$GITEA_REPO/pulls/$ISSUE_NO | jq -r .head.ref
            Then: git fetch origin pull/$ISSUE_NO/head && git checkout FETCH_HEAD
            Make the requested changes, commit, and push to that head branch (use --force-with-lease only if you had to rebase)."
          else
            GUIDE="The comment is on ISSUE #$ISSUE_NO (not a PR).
            If your work produces commits, push a new branch and open a PR from it:
            POST $GITEA_API/repos/$GITEA_REPO/pulls with JSON {\"title\": ..., \"head\": \"<branch>\", \"base\": \"main\"} (Authorization: token $AGENT_TOKEN)."
          fi

          pi -p --mode json "Issue/PR: #$ISSUE_NO — $ISSUE_TITLE
          Issue body:
          $ISSUE_BODY

          User request: $REQUEST
          $GUIDE

          When done, write a short reply (what you did, plus any PR/branch name) to /tmp/reply.md and post it:
          bash .gitea/workflows/post-comment.sh $ISSUE_NO /tmp/reply.md" | jq -j -f .gitea/workflows/output_filter.jq

  assist-opencode:
    name: Assist (opencode)
    if: "contains(gitea.event.comment.body, '@opencode') && !contains(gitea.event.comment.body, '<!-- via:agent -->')"
    runs-on: agent-opencode
    steps:
      - uses: actions/checkout@v4

      - name: Configure bot identity
        run: |
          git config --global user.name bot
          git config --global user.email bot@localhost
          host="${GITEA_SERVER#http://}"; host="${host%/}"
          git remote set-url origin "http://bot:${AGENT_TOKEN}@${host}/${GITEA_REPO}.git"

      - name: Assist with opencode
        env:
          ISSUE_NO: ${{ gitea.event.issue.number }}
          ISSUE_TITLE: ${{ gitea.event.issue.title }}
          ISSUE_BODY: ${{ gitea.event.issue.body }}
          IS_PULL: ${{ gitea.event.is_pull }}
          COMMENT_BODY: ${{ gitea.event.comment.body }}
        run: |
          set -euo pipefail
          REQUEST="$(printf '%s' "$COMMENT_BODY" | sed 's/@opencode[[:space:]]*//g')"

          if [ "$IS_PULL" = "true" ]; then
            GUIDE="The comment is on PULL REQUEST #$ISSUE_NO.
            Find its head branch: curl -s -H 'Authorization: token $AGENT_TOKEN' $GITEA_API/repos/$GITEA_REPO/pulls/$ISSUE_NO | jq -r .head.ref
            Then: git fetch origin pull/$ISSUE_NO/head && git checkout FETCH_HEAD
            Make the requested changes, commit, and push to that head branch (use --force-with-lease only if you had to rebase)."
          else
            GUIDE="The comment is on ISSUE #$ISSUE_NO (not a PR).
            If your work produces commits, push a new branch and open a PR from it:
            POST $GITEA_API/repos/$GITEA_REPO/pulls with JSON {\"title\": ..., \"head\": \"<branch>\", \"base\": \"main\"} (Authorization: token $AGENT_TOKEN)."
          fi

          opencode run "Issue/PR: #$ISSUE_NO — $ISSUE_TITLE
          Issue body:
          $ISSUE_BODY

          User request: $REQUEST
          $GUIDE

          When done, write a short reply (what you did, plus any PR/branch name) to /tmp/reply.md and post it:
          bash .gitea/workflows/post-comment.sh $ISSUE_NO /tmp/reply.md"
